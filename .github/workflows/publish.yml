name: Publish
on:
    push:
        branches:
            - main
            - next

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
    publish:
        # Don't publish from forks.
        if: github.repository == 'itsamziii/tagparse'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            pull-requests: write
            contents: write

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
                  cache: "pnpm"
                  registry-url: "https://registry.npmjs.org"

            - run: pnpm install --frozen-lockfile

            # Pinned to 11.x: npm 12 wraps `npm info --json` output in an array,
            # which breaks published-version detection in `changeset publish`
            # (changesets/changesets#2164). Trusted publishing needs >= 11.5.1.
            - name: Setup npm for trusted publishing
              run: npm install -g npm@11

            - name: Create Release PR or Publish
              id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  version-script: pnpm changeset:version
                  publish-script: pnpm changeset:publish
                  commit-message: "chore: release"
                  pr-title: "chore: release"
                  create-github-releases: true
              env:
                  NPM_CONFIG_PROVENANCE: true
