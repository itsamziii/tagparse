version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
        # Majors get their own PR instead of hiding inside a routine group
        # bump. Action majors rename inputs without warning -- changesets/action
        # v1 -> v2 renamed every input and broke Publish on main.
        update-types:
          - minor
          - patch
